<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir</title>
<!-- plantilla de og.png (1200x630): se abre a ese tamaño y se captura; no está enlazada desde la web -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: linear-gradient(120deg, #170f2b 0%, #2c1b57 55%, #3b2675 100%); color: #f2f4f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; grid-template-columns: 300px 1fr; align-items: center; }
  .esc { justify-self: center; width: 210px; height: 210px; background: #fff; border-radius: 36px; display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgba(242, 194, 48, 0.9); }
  .esc img { width: 150px; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 104px; line-height: 0.95; margin: 0; letter-spacing: 0.5px; }
  h1 span { color: #f2c230; }
  p { font-size: 30px; color: #c9bfe6; margin: 18px 0 34px; max-width: 800px; line-height: 1.3; }
  .cifras { display: flex; gap: 44px; }
  .cifras b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 64px; line-height: 1; color: #fff; }
  .cifras span { font-size: 21px; color: #c9bfe6; }
  .franja { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #f2c230; }
</style>
</head>
<body>
  <div class="esc"><img src="escudos/a693f8ffa8a1.png" alt=""></div>
  <div>
    <h1>Real Madrid<br><span>Analytics</span></h1>
    <p>Post-partido de cada jornada, rendimiento de la plantilla, histórico desde 1902 y palmarés.</p>
    <div class="cifras"><div><b>4.445</b><span>partidos</span></div><div><b>106</b><span>títulos</span></div><div><b>15</b><span>Copas de Europa</span></div></div>
  </div>
  <div class="franja"></div>
</body>
</html>
