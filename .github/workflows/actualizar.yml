# Análisis de la temporada. Se ejecuta en el Mac de Fer (runner propio): WhoScored y FBref bloquean a los servidores de GitHub.
# Si el Mac está dormido a la hora programada, la tarea espera en cola y se ejecuta al despertar.
name: Actualizar temporada
on:
  schedule:
    - cron: "0 0,6 * * *"   # 02:00 y 08:00 en Madrid (horario de verano; en invierno, 01:00 y 07:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temporada
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de Python (se reutiliza entre ejecuciones)
        run: |
          python3 -m venv "$HOME/.rm-analytics-venv"
          "$HOME/.rm-analytics-venv/bin/pip" install -q -r requirements.txt
      - name: Descargar y procesar
        run: '"$HOME/.rm-analytics-venv/bin/python" pipeline/actualizar.py 2>&1 | tee registro.log; exit ${PIPESTATUS[0]}'
        shell: bash
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuentes docs/data
          git diff --cached --quiet && exit 0
          git commit -qm "Datos de la temporada actualizados"
          git pull -q --rebase origin main
          git push -q origin main
      - name: Guardar el registro si algo falló
        if: failure()
        run: |
          git fetch -q origin registros || true
          mkdir -p /tmp/rm-reg && cp registro.log "/tmp/rm-reg/actualizar.log"
          git checkout -q --orphan registros-tmp && git rm -rq --cached . && cp /tmp/rm-reg/actualizar.log . && git add actualizar.log
          git commit -qm "Registro de la última ejecución con fallos" && git push -qf origin registros-tmp:registros
