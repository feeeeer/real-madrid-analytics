# Temporada desde los servidores de GitHub, cada 3 horas, aunque el Mac esté apagado: Understat (xG, tiros, toda la Liga)
# y ESPN (alineaciones, incidencias, estadísticas y resultados de la Copa de Europa). WhoScored y FBref bloquean estos
# servidores: su detalle (pases, duelos, mapas) lo añade el Mac cuando se enciende (actualizar.yml).
name: Actualizar temporada (nube)
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/nube.yml"]
permissions:
  contents: write
concurrency:
  group: nube
  cancel-in-progress: false
jobs:
  nube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Descargar y procesar
        run: NUBE=1 python pipeline/actualizar.py 2>&1 | tee registro.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuentes docs/data
          git diff --cached --quiet && exit 0
          git commit -qm "Datos de la temporada actualizados (nube)"
          # si el Mac publicó mientras tanto, gana lo recién calculado (se rehace con todo lo que hay en el repo)
          git pull -q --rebase -X theirs origin main
          git push -q origin main
